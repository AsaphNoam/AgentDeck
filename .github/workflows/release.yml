name: Release macOS installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true

permissions:
  contents: write

jobs:
  assemble:
    runs-on: macos-14
    env:
      NODE_VERSION: 22.22.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Confirm Apple-silicon runner
        run: test "$(uname -m)" = arm64
      - name: Download private Node runtime
        run: curl --fail --location --remote-name "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz"
      - name: Assemble release assets
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          NODE_TARBALL: ${{ github.workspace }}/node-v22.22.0-darwin-arm64.tar.gz
        run: |
          VERSION="${VERSION#v}"
          export VERSION
          scripts/release/assemble.sh
      - name: Verify release transaction coverage and bootstrap journey
        run: |
          set -euo pipefail
          go test ./internal/release ./internal/cli
          go test -tags sqlite_fts5 ./internal/release ./internal/cli ./internal/archive ./internal/state ./internal/index
          go test -run '^TestBootstrapNonInteractiveDoesNotStartOrEditProfile$' ./internal/cli
      - name: Verify release archive and fresh installation
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          test -f dist/release/manifest.json
          test -f dist/release/chuck-${VERSION#v}-darwin-arm64.tar.gz
          export CHUCK_APP_ROOT="$RUNNER_TEMP/chuck-app"
          export CHUCK_HOME="$RUNNER_TEMP/chuck-home"
          mkdir -p "$CHUCK_HOME"
          printf 'keep\n' > "$CHUCK_HOME/sentinel"
          archive="dist/release/chuck-${VERSION#v}-darwin-arm64.tar.gz"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          packaged="$RUNNER_TEMP/chuck-${VERSION#v}-darwin-arm64/libexec/chuck"
          go version -m "$packaged" | grep -Eq $'^\tbuild\t-tags=(.*,)?sqlite_fts5(,.*)?$'
          "$packaged" release install --archive "$archive" --manifest dist/release/manifest.json
          "$CHUCK_APP_ROOT/bin/chuck" --version
          test "$(cat "$CHUCK_HOME/sentinel")" = keep
          # TS-06.R24: neither the archive, the manifest nor the install tree spells the old name.
          old='agent''deck'
          scripts/check-old-name.sh
          if tar -tzf "$archive" | grep -i "$old"; then exit 1; fi
          if grep -i "$old" dist/release/manifest.json; then exit 1; fi
          if find "$CHUCK_APP_ROOT" -iname "*$old*" | grep .; then exit 1; fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          files: |
            dist/release/chuck-*-darwin-arm64.tar.gz
            dist/release/manifest.json
            scripts/release/install.sh
